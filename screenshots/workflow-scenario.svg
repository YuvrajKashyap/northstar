<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Northstar deterministic scenario workflow</title>
  <desc id="desc">Actual output from the canonical synthetic scenario: a 20 percent market shock and 20 percent withdrawal need produce a 16.5 percent modeled stress loss, 9,987.59 dollar liquidity gap, three deterministic paths, and an approval-required trust receipt.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#f8f4eb"/>
      <stop offset="1" stop-color="#e9e4d9"/>
    </linearGradient>
    <linearGradient id="green" x1="0" x2="1">
      <stop offset="0" stop-color="#21473a"/>
      <stop offset="1" stop-color="#5f7f73"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#17382f" flood-opacity="0.13"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0 0L12 6L0 12Z" fill="#6b8279"/>
    </marker>
    <style>
      .eyebrow{font:700 17px Inter,Segoe UI,sans-serif;letter-spacing:2.4px;fill:#657970}
      .title{font:600 42px Georgia,serif;fill:#16382e}
      .subtitle{font:400 19px Inter,Segoe UI,sans-serif;fill:#67766f}
      .card{fill:#fffdfa;stroke:#ccd4cd;stroke-width:2;filter:url(#shadow)}
      .card-title{font:700 23px Inter,Segoe UI,sans-serif;fill:#17382f}
      .copy{font:400 17px Inter,Segoe UI,sans-serif;fill:#60716a}
      .metric{font:700 31px Inter,Segoe UI,sans-serif;fill:#17382f}
      .metric-label{font:600 14px Inter,Segoe UI,sans-serif;letter-spacing:1px;fill:#73827c}
      .small{font:500 14px Inter,Segoe UI,sans-serif;fill:#73827c}
      .path-title{font:700 17px Inter,Segoe UI,sans-serif;fill:#17382f}
      .path-copy{font:500 15px Inter,Segoe UI,sans-serif;fill:#60716a}
      .line{fill:none;stroke:#6b8279;stroke-width:3;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1600" height="900" rx="30" fill="url(#bg)"/>
  <text x="80" y="76" class="eyebrow">ACTUAL OUTPUT · npm run scenario:report</text>
  <text x="80" y="130" class="title">One synthetic question, five deterministic tools, no hidden execution.</text>
  <text x="80" y="166" class="subtitle">Canonical fixture · seed 20260501 · as of 2026-05-02 · illustrative product evaluation only</text>

  <rect x="78" y="230" width="322" height="210" rx="24" class="card"/>
  <text x="116" y="282" class="card-title">1 · Parse scenario</text>
  <text x="116" y="332" class="metric">−20%</text>
  <text x="116" y="357" class="metric-label">MARKET SHOCK</text>
  <text x="260" y="332" class="metric">20%</text>
  <text x="260" y="357" class="metric-label">WITHDRAWAL</text>
  <text x="116" y="405" class="copy">Horizon: 12 months</text>

  <rect x="478" y="230" width="386" height="210" rx="24" class="card"/>
  <text x="516" y="282" class="card-title">2 · Stress holdings</text>
  <text x="516" y="332" class="metric">−16.5%</text>
  <text x="516" y="357" class="metric-label">MODELED PORTFOLIO LOSS</text>
  <text x="516" y="397" class="copy">$60,687.96 → $50,663.26</text>
  <text x="516" y="423" class="small">Asset-class shock sensitivity v1</text>

  <rect x="942" y="230" width="274" height="210" rx="24" class="card"/>
  <text x="980" y="282" class="card-title">3 · Check liquidity</text>
  <text x="980" y="335" class="metric">$9,987.59</text>
  <text x="980" y="360" class="metric-label">MODELED GAP</text>
  <text x="980" y="403" class="copy">18% coverage</text>
  <text x="980" y="428" class="small">6-month goal-pace heuristic</text>

  <rect x="1294" y="230" width="228" height="210" rx="24" class="card"/>
  <text x="1332" y="282" class="card-title">4 · Bound tax</text>
  <text x="1332" y="335" class="metric">$7,077.96</text>
  <text x="1332" y="360" class="metric-label">UNREALIZED GAIN</text>
  <text x="1332" y="403" class="copy">Cost-basis math only</text>
  <text x="1332" y="428" class="small">No tax liability modeled</text>

  <path d="M400 335H464" class="line"/>
  <path d="M864 335H928" class="line"/>
  <path d="M1216 335H1280" class="line"/>

  <rect x="78" y="528" width="1010" height="270" rx="24" class="card"/>
  <text x="116" y="582" class="card-title">5 · Compare transparent paths</text>

  <rect x="116" y="618" width="282" height="134" rx="18" fill="#f4f0e8" stroke="#d6d9d2"/>
  <text x="140" y="652" class="path-title">Do nothing</text>
  <text x="140" y="684" class="path-copy">Loss −16.5% · coverage 18%</text>
  <text x="140" y="713" class="path-copy">Top-three concentration 81%</text>

  <rect x="430" y="606" width="314" height="158" rx="18" fill="#e4ede7" stroke="#537568" stroke-width="3"/>
  <rect x="454" y="627" width="126" height="25" rx="12" fill="#21473a"/>
  <text x="517" y="645" text-anchor="middle" style="font:700 12px Inter,Segoe UI,sans-serif;letter-spacing:1px;fill:#fff">HEURISTIC DEFAULT</text>
  <text x="454" y="683" class="path-title">Balanced protection</text>
  <text x="454" y="715" class="path-copy">Loss −11.5% · coverage 58%</text>
  <text x="454" y="744" class="path-copy">Top-three concentration 61%</text>

  <rect x="776" y="618" width="274" height="134" rx="18" fill="#f4f0e8" stroke="#d6d9d2"/>
  <text x="800" y="652" class="path-title">Maximum safety</text>
  <text x="800" y="684" class="path-copy">Loss −7.4% · coverage 100%</text>
  <text x="800" y="713" class="path-copy">Top-three concentration 45%</text>

  <rect x="1162" y="528" width="360" height="270" rx="24" fill="url(#green)" filter="url(#shadow)"/>
  <text x="1200" y="582" style="font:700 23px Inter,Segoe UI,sans-serif;fill:#fff">Trust receipt</text>
  <text x="1200" y="628" style="font:600 16px Inter,Segoe UI,sans-serif;fill:#dbe8e2">Human control</text>
  <text x="1200" y="659" style="font:700 24px Inter,Segoe UI,sans-serif;fill:#fff">approval required</text>
  <text x="1200" y="706" style="font:500 16px Inter,Segoe UI,sans-serif;fill:#e8f0ec">Return forecast: not modeled</text>
  <text x="1200" y="735" style="font:500 16px Inter,Segoe UI,sans-serif;fill:#e8f0ec">Tax liability: not modeled</text>
  <text x="1200" y="764" style="font:500 16px Inter,Segoe UI,sans-serif;fill:#e8f0ec">Trades or transfers: none</text>

  <text x="80" y="855" class="small">Reproduce: npm run seed:check · npm run scenario:report · methodology: docs/methodology.md</text>
</svg>
